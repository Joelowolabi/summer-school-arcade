<!-- Summer School Arcade — Solo Quiz (generic, reads live-bank). Zappy Design System. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Summer School Arcade</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="arcade.css">
<style>
  .q-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;min-height:0}
  .question{font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-h1);letter-spacing:var(--ls-heading);color:var(--text-strong);text-align:center;line-height:var(--lh-snug);text-wrap:balance}
  .question.flag{font-size:clamp(72px,16vw,150px);line-height:1}
  .question .qhint2{display:block;font-family:var(--font-body);font-weight:var(--fw-regular);font-size:var(--fs-body);color:var(--text-muted);margin-top:8px}
  .soloflag{display:block;margin:0 auto;height:clamp(120px,26vh,220px);width:auto;border-radius:12px;box-shadow:var(--shadow-l)}
  .answers{display:grid;gap:14px}
  .answers.c2{grid-template-columns:1fr 1fr}
  .answers.c1{grid-template-columns:1fr;max-width:520px;margin:0 auto;width:100%}
  .ans{display:flex;align-items:center;gap:12px;padding:18px 20px;border:1px solid var(--border-hairline);border-radius:var(--radius-xl);background:var(--surface-card);box-shadow:var(--shadow-s);cursor:pointer;font-size:var(--fs-h4);font-weight:var(--fw-semibold);color:var(--text-strong);text-align:left;transition:transform var(--dur-fast) var(--ease-pop),box-shadow var(--dur-base) var(--ease-out-soft),border-color var(--dur-fast)}
  .ans:hover{transform:translateY(-3px);box-shadow:var(--shadow-l)}
  .ans:active{transform:scale(.98)}
  .ans:focus-visible{outline:none;box-shadow:var(--focus-ring)}
  .ans .key{width:34px;height:34px;flex:0 0 auto;border-radius:var(--radius-m);background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:var(--fw-bold);color:var(--text-muted)}
  .ans.picked{border-color:var(--accent-play);box-shadow:0 0 0 3px var(--purple-100),var(--shadow-l)}
  .ans.correct{border-color:var(--green-400);box-shadow:0 0 0 3px var(--green-100),var(--shadow-l)} .ans.correct .key{background:var(--green-400);color:#fff}
  .ans.wrong{border-color:var(--red-400);box-shadow:0 0 0 3px var(--red-100)} .ans.wrong .key{background:var(--red-400);color:#fff}
  .ans[disabled]{cursor:default}
  .diffpick{display:flex;gap:8px;justify-content:center;margin-top:14px}
  .diffpick button{border:1.5px solid var(--border-soft);background:var(--surface-sunken);border-radius:var(--radius-pill);padding:8px 16px;font-weight:var(--fw-bold);font-size:var(--fs-body-s);color:var(--text-body);cursor:pointer}
  .diffpick button.on{border-color:var(--accent-play);background:var(--purple-50);color:var(--text-strong)}
</style>
</head>
<body>
<div class="wrap">
  <div id="hudHost"></div>
  <div class="layout">
    <div class="stage" id="stage">
      <div class="roundrow">
        <span class="eyebrow" id="catLabel">Answer Fast</span>
        <div class="timerpill"><span class="eyebrow" id="timerLabel">Get Ready</span><div class="timer-track"><div class="timer-fill" id="timerFill"></div></div></div>
      </div>
      <div class="prompt" style="margin-bottom:6px"><h1 id="promptTitle">Quiz</h1></div>
      <div class="q-wrap">
        <div class="question" id="question">—</div>
        <div class="answers" id="answers"></div>
      </div>

      <div class="overlay pre center" id="preOverlay">
        <div class="guide">
          <div class="kicker">How to Play</div><h1 id="howTitle">Quiz</h1>
          <p class="goal" id="howGoal">Goal: <b>tap the right answer, fast</b>.</p>
          <p id="howText" style="color:var(--text-muted);max-width:36ch;margin:0 auto"></p>
          <div class="diffpick" id="diffpick">
            <button data-d="easy">🟢 Easy</button><button data-d="med" class="on">🟡 Medium</button><button data-d="hard">🔴 Hard</button>
          </div>
        </div>
        <button class="btn btn-spark" id="startBtn">Start
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="overlay hide center" id="countOverlay"><div class="count">3</div></div>
      <div class="overlay hide center" id="resultOverlay">
        <p class="verdict win" id="verdict">Nice!</p><p class="verdict-sub" id="verdictSub"></p><span class="verdict-pts" id="verdictPts"></span>
      </div>
    </div>
    <div id="boardHost"></div>
  </div>
</div>

<script src="arcade.js"></script>
<script type="module">
import * as Bank from './live-bank.js';
const A=window.Arcade; const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
const GAME=params.get('game')||'trivia-sprint';
let diff=params.get('diff')||'med';
const TIME=8, TOTAL=10;
let players=A.makeRoster();
let round=0, active=false, myAnswer=-1, qStart=0, cur=null, qTimer=null;

const title=Bank.gameTitle(GAME);
document.title=title+' — Summer School Arcade';
$('#promptTitle').textContent=title; $('#howTitle').textContent=title; $('#howText').textContent=Bank.howto(GAME);
document.getElementById('hudHost').innerHTML=A.hud({title, rounds:TOTAL});
document.getElementById('boardHost').innerHTML=A.board('Live Standings');
A.renderBoard(players);

$('#diffpick').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  diff=b.dataset.d; $('#diffpick').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); });

function renderPrompt(q){ const qEl=$('#question');
  if(q.image){ qEl.className='question'; qEl.innerHTML=`<img class="soloflag" src="${q.image}" alt="flag" onerror="this.style.display='none'">${q.hint?`<span class="qhint2">${q.hint}</span>`:''}`; }
  else { const isFlag=q.prompt && [...q.prompt].length<=3 && /\p{Extended_Pictographic}/u.test(q.prompt);
    qEl.className='question'+(isFlag?' flag':''); qEl.innerHTML=`${q.prompt||''}${q.hint?`<span class="qhint2">${q.hint}</span>`:''}`; }
}
function start(){ $('#preOverlay').classList.add('hide'); Bank.resetUsed(GAME); next(); }
function next(){
  if(round>=TOTAL) return end();
  round++; A.setRound(round,TOTAL); myAnswer=-1; active=false;
  cur=Bank.makeQuestion(GAME, round, { difficulty:diff });
  $('#catLabel').textContent=title;
  renderPrompt(cur);
  const opts=cur.options||[];
  const ans=$('#answers'); ans.className='answers '+(opts.length<=2?'c1':'c2');
  ans.innerHTML=opts.map((t,i)=>`<button class="ans" data-i="${i}"><span class="key">${'ABCD'[i]}</span>${t}</button>`).join('');
  A.setPing(players);
  A.countdown($('#countOverlay'), arm);
}
function arm(){ active=true; qStart=performance.now(); $('#timerLabel').textContent='Answer!';
  const fill=$('#timerFill'); fill.style.transition='none'; fill.style.width='100%'; void fill.offsetWidth;
  fill.style.transition=`width ${TIME}s linear`; fill.style.width='0%';
  qTimer=setTimeout(reveal, TIME*1000);
  players.forEach(p=>{ if(p.me||p.disconnected) return; p._correct=Math.random()<p.accuracy; p._t=Math.min(TIME-0.1,(1-p.skill)*4+A.rand(0.6,2.5)); });
}
function score(t){ return 5+Math.round(Math.max(0,(TIME-t)/TIME)*10); }
$('#answers').addEventListener('click', e=>{ const b=e.target.closest('.ans'); if(!b||!active||myAnswer>=0) return;
  myAnswer=+b.dataset.i; players[0]._t=(performance.now()-qStart)/1000;
  document.querySelectorAll('.ans').forEach(x=>x.disabled=true); b.classList.add('picked'); A.sfx('select'); });
function reveal(){ active=false; clearTimeout(qTimer);
  if(myAnswer===cur.correct) players[0].pts+=score(players[0]._t||TIME);
  players.forEach(p=>{ if(p.me||p.disconnected) return; if(p._correct) p.pts+=score(p._t); });
  document.querySelectorAll('.ans').forEach((x,i)=>{ x.disabled=true; if(i===cur.correct) x.classList.add('correct'); else if(i===myAnswer) x.classList.add('wrong'); });
  A.renderBoard(players);
  const ov=$('#resultOverlay'),v=$('#verdict'),sub=$('#verdictSub'),pts=$('#verdictPts');
  const answerLabel=(cur.options&&cur.options[cur.correct]!=null)?cur.options[cur.correct]:'';
  if(myAnswer===cur.correct){ const g=score(players[0]._t||TIME); v.textContent='Correct!'; v.className='verdict win'; sub.textContent='Nice and quick.'; pts.textContent=`+${g} points`; A.confetti($('#stage'),36); A.sfx('correct'); }
  else if(myAnswer>=0){ v.textContent='Not Quite'; v.className='verdict miss'; sub.innerHTML=`The answer was <b>${answerLabel}</b>.`; pts.textContent='+0 points'; A.sfx('wrong'); }
  else { v.textContent='Time!'; v.className='verdict late'; sub.innerHTML=`The answer was <b>${answerLabel}</b>.`; pts.textContent='+0 points'; A.sfx('wrong'); }
  ov.classList.remove('hide'); setTimeout(()=>{ ov.classList.add('hide'); next(); }, 2200);
}
function end(){ A.finishGame(players); const sorted=[...players].sort((a,b)=>b.pts-a.pts); const myRank=sorted.findIndex(p=>p.me)+1;
  $('#promptTitle').innerHTML=title+' <span class="hi">Complete!</span>'; $('#timerLabel').textContent='Done';
  const ov=$('#resultOverlay'); $('#verdict').textContent=myRank<=3?'Top 3!':`You Placed #${myRank}`; $('#verdict').className='verdict '+(myRank<=3?'win':'late');
  $('#verdictSub').innerHTML=`You scored <b>${players[0].pts}</b> this game.`; $('#verdictPts').textContent=`Rank ${myRank} of 30`;
  ov.classList.remove('hide'); if(myRank<=3) A.confetti($('#stage'),90); }
window.addEventListener('keydown', e=>{ const i='abcd'.indexOf(e.key.toLowerCase()); if(i>=0&&active){ const b=document.querySelector(`.ans[data-i="${i}"]`); if(b&&!b.disabled) b.click(); } });
$('#startBtn').addEventListener('click', start);
setInterval(()=>{ if(!active) A.setPing(players); },1400);
</script>
</body>
</html>
